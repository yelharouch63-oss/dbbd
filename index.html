<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You My Sheyla Basma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #08030f 100%);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .glass-card-falling {
            position: absolute;
            top: -100px;
            user-select: none;
            pointer-events: none;
            animation: fallStraight linear infinite;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 182, 193, 0.35);
            box-shadow: 0 4px 18px rgba(255, 105, 180, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: 700;
            line-height: 1.3;
        }

        @keyframes fallStraight {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }
            15% {
                opacity: 0.95;
            }
            85% {
                opacity: 0.95;
            }
            100% {
                transform: translateY(108vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <script>
        const colors = ['#ff69b4', '#ff8da1', '#ffffff', '#e0b0ff', '#ffb6c1', '#ffd1dc'];
        
        const phrases = [
            '✨ I LOVE YOU ✨<br>MY SHEYLA BASMA ❤️', 
            '💖 I LOVE YOU 💖<br>MY SHEYLA BASMA ✨', 
            '🌹 I LOVE YOU 🌹<br>MY SHEYLA BASMA 💕', 
            '❤️ I LOVE YOU ❤️<br>MY SHEYLA BASMA 🌹'
        ];

        function createFallingCard() {
            const card = document.createElement('div');
            card.classList.add('glass-card-falling');
            
            const selectedColor = colors[Math.floor(Math.random() * colors.length)];
            card.innerHTML = phrases[Math.floor(Math.random() * phrases.length)];
            card.style.color = selectedColor;
            
            card.style.textShadow = `0 0 8px ${selectedColor}`;
            card.style.borderColor = selectedColor + '55';

            card.style.left = (Math.random() * 40 + 5) + 'vw';
            
            const fontSize = Math.random() * 2 + 13;
            card.style.fontSize = fontSize + 'px';
            
            const duration = Math.random() * 4 + 7;
            card.style.animationDuration = duration + 's';

            document.body.appendChild(card);

            setTimeout(() => {
                card.remove();
            }, duration * 1000);
        }

        setInterval(createFallingCard, 800);
    </script>
</body>
</html>
